name: Keep Render app awake

# Two separate things this pings for:
# 1. /login — Render's free tier spins the service down after ~15 minutes
#    with no traffic, and the next real visitor eats a 20-60s cold-start
#    delay. Now on a paid Render plan so this half is largely a no-op, but
#    left in as a cheap safety net.
# 2. /api/health — actually touches Postgres (a single `select 1` on the
#    shared connection pool), which /login never did. Supabase's pooler
#    hands out connections faster when one's already warm, so keeping this
#    hit regularly shaves the reconnect tax off of whoever's first real
#    request lands after a gap — separate from, and doesn't fix, the
#    underlying per-query slowness of the current (Nano) compute tier.
# Offset from the top of each 5-minute mark rather than exactly on it —
# GitHub's own docs note jobs scheduled exactly on the mark are the most
# likely to get delayed, since that's when Actions load peaks globally.
on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://nama-yoso-erp.onrender.com/login)
          echo "Response: HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::Unexpected status code from keep-alive ping: $code"
          fi
      - name: Warm the database connection
        run: |
          body=$(curl -s --max-time 20 https://nama-yoso-erp.onrender.com/api/health)
          echo "Response: $body"
          ok=$(echo "$body" | grep -o '"ok":true' || true)
          if [ -z "$ok" ]; then
            echo "::warning::DB health check did not report ok: $body"
          fi
